services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careerflow
      POSTGRES_USER: careerflow
      POSTGRES_PASSWORD: careerflow
    ports:
      - "5432:5432"
    volumes:
      - careerflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerflow -d careerflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/careerflow
      DATABASE_USERNAME: careerflow
      DATABASE_PASSWORD: careerflow
      DEMO_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  careerflow-postgres:
